command:
  - "python"
  - "app.py"

env:
  # ---- Lakebase. Only the app database; tracing belongs to the other two apps.
  - name: LAKEBASE_SECRET_SCOPE
    value: "capstone"
  - name: LAKEBASE_SECRET_KEY
    value: "lakebase-url"

  # ---- Embeddings: must match the model the ingestion notebook and the MCP
  # server use. The pgvector column is VECTOR(384); a mismatch fails at query time.
  - name: EMBEDDING_MODEL
    value: "sentence-transformers/all-MiniLM-L6-v2"
  - name: SENTENCE_TRANSFORMERS_HOME
    value: "/tmp/.cache/huggingface"
  - name: HF_HOME
    value: "/tmp/.cache/huggingface"

  # ---- Massive and Alpaca keys are NOT here. config.py reads them at runtime
  # from the secret scope above (massive-api-key, alpaca-api-key-id,
  # alpaca-secret-key), the same way lakebase.py reads the connection URL.
  - name: MASSIVE_MIN_INTERVAL
    value: "12.5"
  # PAPER endpoint. Changing this to api.alpaca.markets makes approved trades
  # real. This app is the only one that can submit an order at all.
  - name: ALPACA_BASE_URL
    value: "https://paper-api.alpaca.markets"

  # ---- The Agent Bricks serving endpoint backing the Chat tab. It does not
  # exist until the agent is deployed, so it is left blank on the first deploy:
  # the chat tab then explains itself instead of erroring. Fill it in and redeploy.
  - name: CAPSTONE_AGENT_ENDPOINT
    value: "mas-70068bcc-endpoint"
  # An agent that calls several MCP tools before it answers is not fast, and a
  # default HTTP timeout is shorter than a tool-using turn.
  - name: CAPSTONE_CHAT_TIMEOUT
    value: "120"
  # A tool behind the MCP server is not run on the agent's say-so: the turn
  # stops and asks. This is the STARTING position of the chat tab's
  # "Auto-approve tools" checkbox, which the user can flip at any time without
  # a redeploy. "0" shows Accept / Reject on every tool call; "1" answers yes
  # for them - safe here (execute_trade still needs the user's confirmation
  # key) but tools then run without being announced first.
  - name: CAPSTONE_CHAT_AUTO_APPROVE
    value: "0"
  # How many times one question may come back asking to run more tools. The
  # agent calls tools one at a time, so a thorough answer needs several rounds.
  - name: CAPSTONE_CHAT_TOOL_ROUNDS
    value: "8"
  # The chat tab's starter questions are written by the agent, from the actual
  # holdings, watchlist and plan - there is no hardcoded list. The app pastes
  # those facts into the prompt so the turn needs no tool calls, and the reply
  # is cached against a hash of them: switching tabs is free, and adding a
  # holding invalidates it. The refresh button beside the chips forces a new set.
  - name: CAPSTONE_CHAT_SUGGESTION_TTL
    value: "1800"
  # How many questions to ask for. Kept small: they arrive sooner and a short
  # row is easier to read than a long one.
  - name: CAPSTONE_CHAT_SUGGESTION_COUNT
    value: "3"
  # The chip row is not worth the full chat budget. Past this the row says it
  # could not think of any and offers a retry, which beats a tab that looks stuck.
  - name: CAPSTONE_CHAT_SUGGESTION_TIMEOUT
    value: "25"

  # How many days before the "time for a new report" banner appears.
  - name: REPORT_STALE_DAYS
    value: "30"
